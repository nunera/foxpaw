name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Tag matches package.json version
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run build:bin
      - name: Smoke test linux-x64
        run: dist/bin/foxpaw-linux-x64 help
      - name: Checksums
        working-directory: dist/bin
        run: sha256sum foxpaw-* > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    # Trusted publishing: npm trusts this workflow (nunera/foxpaw, release.yml) through GitHub's OIDC token.
    # No npm token is stored anywhere; provenance is attached automatically.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm 11.5.1+ (needed for trusted publishing)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npm publish --access public
