// foxpaw AutoConfig. The first line of an AutoConfig file must be a comment.
//
// Starts the WebDriver BiDi Remote Agent from inside the browser (RemoteAgent.startAtRuntime with
// isBrowserAutomation = false) instead of via --remote-debugging-port. The command-line flag marks the
// session as automation, which sets navigator.webdriver = true in every page; bot checks such as
// Cloudflare Turnstile read it. Started this way, it stays false. The agent listens on 127.0.0.1:9222.
//
// Only a process started with FOXPAW_REMOTE_CONTROL=1 (as "foxpaw launch --dynamic" does) opens the port.
// Every other start of this browser stays as it was: the per-connection consent prompt is turned off
// below, so without this gate any local program could drive the browser.
// Keep this file free of dollar signs, backticks and backslashes: nixpkgs' wrapFirefox pastes it into an
// unquoted shell heredoc.
pref("remote.experimental.dynamicstart.enabled", true);
pref("remote.experimental.dynamicstart.prompt.enabled", false);
// The "remote control is on" bars can't be dismissed in Zen.
pref("remote.experimental.dynamicstart.banner.enabled", false);
pref("remote.experimental.dynamicstart.connectionbanner.enabled", false);

try {
  if (Services.env.get("FOXPAW_REMOTE_CONTROL") === "1") {
    // startAtRuntime throws until a browser window has finished its idle startup tasks.
    var foxpawRemoteControl = {
      observe: function (subject, topic) {
        Services.obs.removeObserver(foxpawRemoteControl, topic);
        ChromeUtils.importESModule(
          "chrome://remote/content/components/RemoteAgent.sys.mjs"
        ).RemoteAgent.startAtRuntime({ isBrowserAutomation: false });
      },
    };
    Services.obs.addObserver(foxpawRemoteControl, "browser-idle-startup-tasks-finished");
  }
} catch (error) {
  Services.prefs.setStringPref("remote.foxpaw.startError", String(error));
}
